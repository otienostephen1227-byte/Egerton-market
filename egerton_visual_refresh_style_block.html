<style id="egerton-visual-refresh">
/* Egerton Marketplace visual refresh — homepage/listings deliberately untouched. */
:root {
  --egv-green: #198754;
  --egv-green-strong: #0f6b43;
  --egv-green-soft: #e6f5eb;
  --egv-border: #dce6df;
  --egv-muted: #68786e;
  --egv-radius: 16px;
  --egv-shadow: 0 10px 28px rgba(11, 40, 24, .10);
}
body:not(.dark-mode) #chatSessionModal .chat-session-card,
body:not(.dark-mode) #callModal .call-card {
  border: 1px solid var(--egv-border);
  border-radius: 20px;
  box-shadow: var(--egv-shadow);
}
#chatSessionModal .chat-session-card {
  overflow: hidden;
  gap: 0;
}
#chatSessionModal .chat-session-top {
  flex-wrap: nowrap;
  gap: 10px;
  padding: 6px 2px 12px;
  margin-bottom: 8px;
}
#chatSessionModal .chat-peer-heading {
  min-width: 0;
  line-height: 1.3;
  letter-spacing: -.2px;
}
#chatSessionModal .chat-session-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 6px;
}
#chatSessionModal .chat-session-actions button,
#chatSessionModal #chatCloseBtn {
  width: 38px;
  min-width: 38px;
  height: 38px;
  padding: 0;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  line-height: 1;
  border: 1px solid var(--egv-border);
  background: #f2f8f4;
  color: #174b31;
  box-shadow: none;
}
#chatSessionModal .chat-session-actions button:active,
#chatSessionModal #chatCloseBtn:active {
  transform: scale(.97);
}
#chatSessionModal .chat-session-messages,
#chatSessionModal #liveChatMessages {
  border-radius: 16px;
  padding: 12px;
  scroll-behavior: smooth;
  overscroll-behavior: contain;
}
#chatSessionModal #liveChatMessages > div {
  max-width: min(86%, 520px);
  padding: 10px 12px;
  margin-top: 8px;
  margin-bottom: 8px;
  border-radius: 14px;
  line-height: 1.45;
  overflow-wrap: anywhere;
  box-shadow: 0 1px 2px rgba(0,0,0,.06);
}
#chatSessionModal #liveChatMessages > div[style*="margin-left: auto"] {
  border-bottom-right-radius: 5px;
}
#chatSessionModal #liveChatMessages > div[style*="margin-right: auto"] {
  border-bottom-left-radius: 5px;
}
#chatSessionModal #liveChatMessages .small {
  display: block;
  margin-top: 5px;
  font-size: 11px;
  line-height: 1.25;
  opacity: .82;
}
#chatSessionModal #liveChatMessages audio {
  display: block;
  width: min(290px, 100%);
  max-width: 100%;
  margin-top: 6px;
  border-radius: 999px;
}
#chatSessionModal .chat-session-compose {
  align-items: center;
  gap: 8px;
  padding-top: 8px;
}
#chatSessionModal .chat-session-compose input,
#chatSessionModal .chat-session-compose textarea {
  min-width: 0;
  min-height: 44px;
  border-radius: 999px;
  padding: 11px 16px;
  border: 1px solid var(--egv-border);
  box-shadow: none;
}
#chatSessionModal .chat-session-compose input:focus,
#chatSessionModal .chat-session-compose textarea:focus {
  outline: 3px solid rgba(25,135,84,.17);
  border-color: var(--egv-green);
}
#chatSessionModal .chat-session-compose button {
  min-height: 42px;
  border-radius: 999px;
  font-weight: 700;
}
#chatSessionModal #voiceRecordBtn {
  width: 42px;
  min-width: 42px;
  height: 42px;
  padding: 0;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
#voiceRecordStatus, #liveChatNotice {
  font-size: 12px;
  line-height: 1.4;
  margin: 5px 2px;
}
#chatSessionModal .chat-session-actions button:focus-visible,
#chatSessionModal .chat-session-compose button:focus-visible,
#chatSessionModal #chatCloseBtn:focus-visible {
  outline: 3px solid rgba(25,135,84,.28);
  outline-offset: 2px;
}
body.dark-mode #chatSessionModal .chat-session-card {
  background: #101a14 !important;
  color: #edf7f0 !important;
  border: 1px solid #2b4033;
  box-shadow: 0 18px 50px rgba(0,0,0,.38);
}
body.dark-mode #chatSessionModal .chat-session-top {
  border-color: #2b4033 !important;
}
body.dark-mode #chatSessionModal .chat-session-actions button,
body.dark-mode #chatSessionModal #chatCloseBtn {
  background: #1c3024 !important;
  color: #d8f7e2 !important;
  border-color: #355744 !important;
}
body.dark-mode #chatSessionModal .chat-session-messages,
body.dark-mode #chatSessionModal #liveChatMessages {
  background: #0b120e !important;
  border-color: #2b4033 !important;
}
body.dark-mode #chatSessionModal #liveChatMessages > div[style*="margin-left: auto"] {
  background: #176b45 !important;
  color: #fff !important;
}
body.dark-mode #chatSessionModal #liveChatMessages > div[style*="margin-right: auto"] {
  background: #202c26 !important;
  color: #f4faf6 !important;
}
body.dark-mode #chatSessionModal #liveChatMessages > div .small {
  color: #d0e0d6 !important;
}
body.dark-mode #chatSessionModal .chat-session-compose input,
body.dark-mode #chatSessionModal .chat-session-compose textarea {
  background: #17231b !important;
  color: #f5fff8 !important;
  border-color: #3b5545 !important;
}
body.dark-mode #chatSessionModal .chat-session-compose input::placeholder,
body.dark-mode #chatSessionModal .chat-session-compose textarea::placeholder {
  color: #b4c5ba !important;
}
body.dark-mode #chatSessionModal .chat-session-compose button {
  background: #087e4e !important;
  color: #fff !important;
}
body.dark-mode #voiceRecordStatus,
body.dark-mode #liveChatNotice {
  color: #b9cbbf !important;
}
/* Discover/student cards only — product/listing cards and Home intro are not targeted. */
.comrade-card {
  border-radius: 18px;
  padding: 16px;
  border: 1px solid var(--egv-border);
  box-shadow: 0 6px 20px rgba(11,40,24,.07);
  transition: border-color .18s ease, box-shadow .18s ease;
}
.comrade-card p {
  line-height: 1.45;
}
.comrade-card button {
  border-radius: 12px;
  min-height: 40px;
  font-weight: 650;
}
body.dark-mode .comrade-card {
  background: #121d16 !important;
  color: #eef7f1 !important;
  border-color: #2b4033 !important;
  box-shadow: 0 8px 24px rgba(0,0,0,.22);
}
body.dark-mode .comrade-card .student-avatar-stage {
  border-radius: 14px;
}
body.dark-mode .comrade-card .student-photo {
  border-color: #3e9d69;
  outline-color: #4b8d64;
  box-shadow: 0 0 0 3px rgba(25,135,84,.16);
}
body.dark-mode .comrade-card .student-avatar-shield {
  filter: drop-shadow(0 3px 7px rgba(25,135,84,.25));
}
/* Call screen controls: preserve existing actions and status text. */
#callModal .call-card {
  gap: 10px;
}
#callModal .call-actions {
  gap: 9px;
}
#callModal .call-actions button {
  min-height: 44px;
  border-radius: 13px;
  font-weight: 700;
}
#callModal .call-status {
  border-radius: 12px;
  line-height: 1.45;
}
body.dark-mode #callModal .call-card {
  background: #0e1711 !important;
  color: #f4fff7 !important;
  border-color: #2b4033 !important;
}
body.dark-mode #callModal .call-status {
  background: #1a3022 !important;
  color: #eaffef !important;
  border-color: #365642 !important;
}
@media (max-width: 480px) {
  #chatSessionModal .chat-session-card {
    padding: 10px;
  }
  #chatSessionModal .chat-session-top {
    gap: 6px;
  }
  #chatSessionModal .chat-session-actions {
    gap: 4px;
  }
  #chatSessionModal .chat-session-actions button,
  #chatSessionModal #chatCloseBtn {
    width: 34px;
    min-width: 34px;
    height: 34px;
  }
  #chatSessionModal #liveChatMessages > div {
    max-width: 92%;
    padding: 9px 10px;
  }
  #chatSessionModal .chat-session-compose {
    gap: 6px;
  }
  #chatSessionModal .chat-session-compose input {
    padding-left: 14px;
  }
  .comrade-card {
    padding: 12px;
    border-radius: 16px;
  }
}
@media (prefers-reduced-motion: reduce) {
  .comrade-card,
  #chatSessionModal button {
    transition: none !important;
  }
}
</style>
